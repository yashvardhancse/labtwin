name: ROS 2

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ros2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-core:
    name: Python core (lint, tests, MCAP interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt pyyaml "ruff==0.17.6" pytest
      - name: Lint (ruff)
        run: python -m ruff check ros2
      - name: Unit tests (S-curve, determinism, MCAP round-trip)
        working-directory: ros2/src/labtwin_sim
        run: python -m pytest -q
      - name: Interop — the Python side writes a LabTwin MCAP the official reader validates
        run: |
          mkdir -p .artifacts
          ( cd ros2/src/labtwin_sim && python -m labtwin_sim.run standard "$GITHUB_WORKSPACE/.artifacts/py.mcap" )
          python scripts/verify_mcap.py .artifacts/py.mcap

  # The ROS 2 interfaces and rclpy node build with `colcon build` and run with
  # `ros2 launch labtwin_sim bringup.launch.py`; see ros2/README.md. That build
  # is a local/dev step rather than a CI job, to avoid a ROS-image-specific
  # pipeline — the Python core above is what CI verifies on every push.
